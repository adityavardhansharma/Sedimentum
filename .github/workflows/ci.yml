name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.engine }} (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [v1, v2, v3, holo, stratum]
        os: [ubuntu-latest, macos-latest]
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check src build.zig build.zig.zon
      - run: zig build -Doptimize=${{ matrix.optimize }}
      - run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
